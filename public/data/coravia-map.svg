<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" id="coravia-map">
  <!-- E5: Sta. Catalina (noroeste) -->
  <path id="E5" d="M 20 20 L 200 20 L 200 120 L 140 150 L 20 150 Z" fill="#1e3a5f" stroke="#060f1e" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="white">E5</text>
  <text x="110" y="105" text-anchor="middle" font-size="8" fill="#94a3b8">Sta. Catalina</text>

  <!-- E7: Alcalá (noreste) -->
  <path id="E7" d="M 200 20 L 380 20 L 380 140 L 280 140 L 200 120 Z" fill="#1e3a5f" stroke="#060f1e" stroke-width="2"/>
  <text x="290" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="white">E7</text>
  <text x="290" y="100" text-anchor="middle" font-size="8" fill="#94a3b8">Alcalá</text>

