name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios: solo lectura del repo + escritura en Pages.
# Ningún otro token tiene acceso.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security-audit:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Falla el pipeline si hay vulnerabilidades de severidad HIGH o CRITICAL.
      # Las vulnerabilidades de devDependencies (eslint, typescript-parser) se
      # excluyen porque no se incluyen en el bundle desplegado.
      - name: Auditoría npm — falla en HIGH/CRITICAL de producción
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Build Next.js (export estático)
        run: npm run build
        env:
          # Aseguramos que el basePath esté disponible también en tiempo de build
          NEXT_PUBLIC_BASE_PATH: /Coravia

      - name: Verificar que no hay secretos en el bundle
        # Busca patrones de secretos reales: tokens de API, claves AWS, tokens JWT largos.
        # Excluye __SECRET_INTERNALS de React (es parte del framework, no un secreto).
        run: |
          FOUND=0
          # OpenAI / Anthropic API keys
          grep -rE "sk-[a-zA-Z0-9]{40,}" out/ --include="*.js" --include="*.html" && FOUND=1
          # AWS Access Key ID
          grep -rE "AKIA[0-9A-Z]{16}" out/ --include="*.js" --include="*.html" && FOUND=1
          # Generic high-entropy tokens (Bearer xxxxx... de >32 chars)
          grep -rE "Bearer [a-zA-Z0-9+/]{32,}" out/ --include="*.js" --include="*.html" && FOUND=1
          # GitHub tokens
          grep -rE "ghp_[a-zA-Z0-9]{36}" out/ --include="*.js" --include="*.html" && FOUND=1
          if [ $FOUND -eq 1 ]; then
            echo "⛔ Secretos reales detectados en el bundle."
            exit 1
          fi
          echo "✅ No se detectaron secretos reales en el bundle."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Despliegue en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
