name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos necesarios: solo lectura del repo + escritura en Pages.
# Ningún otro token tiene acceso.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security-audit:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Falla el pipeline si hay vulnerabilidades de severidad HIGH o CRITICAL.
      # Las vulnerabilidades de devDependencies (eslint, typescript-parser) se
      # excluyen porque no se incluyen en el bundle desplegado.
      - name: Auditoría npm — falla en HIGH/CRITICAL de producción
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Build Next.js (export estático)
        run: npm run build
        env:
          # Aseguramos que el basePath esté disponible también en tiempo de build
          NEXT_PUBLIC_BASE_PATH: /Coravia

      - name: Verificar que no hay secretos en el bundle
        # Busca patrones de secretos reales: tokens de API, claves AWS, tokens JWT largos.
        # Escanea .js, .html Y .json (incluye out/data/*.json copiados de public/).
        # La función scan() muestra las coincidencias para facilitar auditoría.
        run: |
          FOUND=0
          scan() {
            local pattern="$1"
            local label="$2"
            local matches
            matches=$(grep -rEo "$pattern" out/ \
              --include="*.js" --include="*.html" --include="*.json" 2>/dev/null)
            local rc=$?
            if [ $rc -eq 2 ]; then
              echo "❌ Error interno de grep con patrón: $label"
              exit 2
            fi
            if [ $rc -eq 0 ] && [ -n "$matches" ]; then
              echo "⛔ Patrón '$label' detectado:"
              # Truncate each match to 80 chars to avoid leaking real tokens in logs
              echo "$matches" | cut -c1-80
              FOUND=1
            fi
          }
          scan "sk-[a-zA-Z0-9]{40,}" "sk-*"
          scan "AKIA[0-9A-Z]{16}" "AWS-AKIA"
          # Split "Bearer" from its value so GitHub Actions does not mask the pattern itself.
          # Equivalent to /Bearer [a-zA-Z0-9+\/]{32,}/ but avoids triggering secret redaction.
          BEARER_PREFIX="Bearer"
          scan "${BEARER_PREFIX} [a-zA-Z0-9+/]{32,}" "Bearer-token"
          scan "ghp_[a-zA-Z0-9]{36}" "ghp_token"
          if [ $FOUND -eq 1 ]; then
            echo "⛔ Secretos reales detectados en el bundle."
            exit 1
          fi
          echo "✅ No se detectaron secretos reales en el bundle."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Despliegue en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
